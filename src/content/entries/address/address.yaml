label: Address (address module)
group: address
order: 10
raw:
  - '{{ __ENTITY__.__FIELD__.address_line1 }}'
  - '{{ __ENTITY__.__FIELD__.address_line2 }}'
  - '{{ __ENTITY__.__FIELD__.postal_code }}'
  - '{{ __ENTITY__.__FIELD__.locality }}'
  - '{{ __ENTITY__.__FIELD__.country_code }}'
render:
  - "{{ content.__FIELD__.0.address_line1['#value'] }}"
  - "{{ content.__FIELD__.0.address_line2['#value'] }}"
  - "{{ content.__FIELD__.0.postal_code['#value'] }}"
  - "{{ content.__FIELD__.0.locality['#value'] }}"
  - "{{ content.__FIELD__.0.country['#value'] }}"
helper:
  - code: "{{ content.__FIELD__|field_value.0.address_line1['#value'] }}"
    module: twig_field_value
  - code: "{{ content.__FIELD__|field_value.0.locality['#value'] }}"
    module: twig_field_value
notes: Render keys come from the default formatter and only exist for fields the country’s address format uses (`country` is always there). Their `#value` is already HTML-escaped, so an apostrophe or ampersand prints as an entity; the raw properties don’t have this problem.
