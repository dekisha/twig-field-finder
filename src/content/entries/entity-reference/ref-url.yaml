review: Original raw `.0.entity.url` relied on Entity::url(), removed in Drupal 9, and toUrl() is not allowed by the Twig sandbox. Replaced with path(). The render snippet prints `#url`, a Url object, without `|render` (compare link-url) — verify it outputs a string.
